<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小学校国語 ことばの広場</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#f1f5f9;color:#0f172a;font-family:'UD デジタル 教科書体 NK-R','UD Digi Kyokasho NK-R','BIZ UDGothic',sans-serif;font-weight:700;user-select:none;touch-action:manipulation}button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}button:active:not(:disabled){filter:brightness(.92)}button:focus-visible{outline:4px solid #0f172a;outline-offset:-6px}button:disabled{cursor:default}ruby{ruby-align:center}rt{font-size:.48em;line-height:1.2;font-weight:700;color:inherit}#app{height:100vh;height:100dvh;display:grid;grid-template-rows:clamp(52px,9vh,78px) minmax(0,1fr);gap:6px;padding:6px}header{display:grid;grid-template-columns:clamp(80px,15vw,170px) minmax(0,1fr) clamp(80px,15vw,170px);align-items:center;background:#0284c7;border-bottom:4px solid #075985;border-radius:12px;color:white;padding:4px;gap:4px}header h1{margin:0;text-align:center;font-size:clamp(18px,3vw,36px);line-height:1.6}header button{height:100%;border:2px solid #b45309;border-radius:9px;background:#fbbf24;color:#172033;font-size:clamp(14px,1.8vw,23px);padding:2px}#main{min-height:0;display:flex;flex-direction:column;gap:6px}h2,p{margin:0}.screen-title{flex:none;text-align:center;background:#fef3c7;border:2px solid #fcd34d;border-radius:10px;padding:4px;font-size:clamp(18px,2.5vw,30px);line-height:1.7}.category-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:8px}.category{border:0;border-bottom:6px solid #0003;border-radius:18px;background:var(--color);color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:5px;min-width:0;min-height:0}.category:last-child{grid-column:span 2}.category .label{font-size:clamp(22px,3.1vw,44px);line-height:1.65}.category small{font-size:clamp(12px,1.5vw,18px)}.steps{display:grid;grid-auto-rows:minmax(0,1fr);gap:8px;flex:1;min-height:0}.step{border:4px solid var(--color);border-radius:15px;background:white;text-align:left;display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px;font-size:clamp(18px,2.8vw,36px);min-height:0}.number{background:var(--color);color:white;border-radius:8px;text-align:center;padding:4px}.step .label{line-height:1.7}.badge{font-size:clamp(14px,1.7vw,22px);color:#047857;white-space:nowrap}.note{font-size:clamp(12px,1.4vw,18px);text-align:center;line-height:1.6}.quiz{flex:1;min-height:0;display:grid;grid-template-rows:minmax(44px,auto) minmax(50px,.24fr) minmax(0,1fr) minmax(0,1.3fr);gap:6px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:6px;background:white;border:1px solid #cbd5e1;border-radius:10px;padding:3px 8px;font-size:clamp(16px,2vw,25px)}.hint-btn{background:#fbbf24;border:2px solid #d97706;border-radius:8px;padding:4px 14px}.feedback{background:#fff7d6;border:2px solid #fcd34d;border-radius:10px;padding:4px 8px;text-align:center;display:flex;justify-content:center;align-items:center;min-height:0;font-size:clamp(16px,2vw,26px);line-height:1.65}.question{background:white;border:3px solid #cbd5e1;border-radius:16px;padding:8px;display:flex;align-items:center;justify-content:center;text-align:center;min-height:0;min-width:0}.question .fit{font-size:clamp(24px,3.6vw,51px);line-height:1.7}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;min-height:0}.options.three{grid-template-columns:repeat(3,minmax(0,1fr))}.options.four{grid-template-rows:repeat(2,minmax(0,1fr))}.option{border:4px solid #38bdf8;background:white;border-radius:16px;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;min-height:0;min-width:0}.fit{display:block;width:100%;overflow-wrap:anywhere}.option .fit{font-size:clamp(24px,3.8vw,54px);line-height:1.65}.option.right{background:#dcfce7;border-color:#16a34a}.option.wrong{background:#ffe4e6;border-color:#f43f5e}.end{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.end-card{max-width:760px;width:100%;max-height:100%;border:4px solid #10b981;background:white;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px;text-align:center}.end-card h2{font-size:clamp(24px,4vw,48px);line-height:1.7}.end-card p{font-size:clamp(18px,2.5vw,30px);line-height:1.7}.actions{display:flex;gap:8px}.primary,.secondary{border:2px solid #047857;border-radius:12px;padding:8px;flex:1;font-size:clamp(18px,2.5vw,30px);line-height:1.6}.primary{background:#059669;color:white}.secondary{background:#ecfdf5}.review .end-card{border-color:#f59e0b}.review .primary{background:#f59e0b;border-color:#b45309;color:#172033}@media(max-width:600px){.options.three{grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr))}.step{grid-template-columns:30px minmax(0,1fr) auto;gap:4px}.actions{flex-direction:column}.quiz{grid-template-rows:44px minmax(50px,.35fr) minmax(0,.8fr) minmax(0,1.5fr)}}@media(max-height:500px){#app{grid-template-rows:44px minmax(0,1fr);padding:3px;gap:3px}.screen-title{font-size:16px}.end-card{gap:4px;padding:5px}.end-card h2{font-size:24px}.end-card p{font-size:17px}.quiz{grid-template-rows:36px minmax(40px,.4fr) minmax(0,.9fr) minmax(0,1.2fr)}}

/* 問題と選択肢は右から左へ読む縦書き。操作部分は横書き。 */
.quiz{grid-template-rows:minmax(44px,auto) minmax(54px,.16fr) minmax(0,1fr)}
.quiz-body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:8px;min-height:0}
.question{grid-column:2;grid-row:1;padding:12px}
.options,.options.four{grid-column:1;grid-row:1;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr);direction:rtl}
.options.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.option{padding:10px 8px;direction:ltr}
.question .fit,.option .fit{writing-mode:vertical-rl;text-orientation:mixed;width:auto;max-width:100%;height:100%;min-height:0;line-height:1.85;text-align:center;overflow-wrap:normal;line-break:strict;font-size:clamp(25px,3.2vw,46px)}
.question .fit{font-size:clamp(26px,3.5vw,48px)}
.vertical-number{text-combine-upright:all}
.level-label{font-size:clamp(15px,1.8vw,24px)}
.level-up .end-card{border-color:#7c3aed;background:#f5f3ff}
.level-up .primary{background:#7c3aed;border-color:#5b21b6}
@media(max-width:600px){.quiz{grid-template-rows:44px minmax(64px,.19fr) minmax(0,1fr)}.quiz-body{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:4px}.options,.options.four{gap:4px}.option{padding:8px 3px;border-width:2px}.question{padding:8px 5px;border-width:2px}.question .fit,.option .fit{font-size:25px;line-height:1.65}.toolbar{padding:3px 4px}.hint-btn{padding:4px 6px}.level-label{font-size:14px}}
@media(max-height:500px){.quiz{grid-template-rows:36px minmax(45px,.2fr) minmax(0,1fr)}.question .fit,.option .fit{font-size:26px}}

/* 問題と回答の識別・文字拡大・回答ボタン縮小 */
.question{background:#e0f2fe;border-color:#0284c7;padding:1.2px;justify-content:flex-end;align-items:flex-start}
.question .fit{text-align:start;font-size:clamp(52px,7vw,96px)}
.option{width:75%;height:75%;justify-self:center;align-self:center}
.option:not(.right):not(.wrong){background:#fef3c7;border-color:#d97706}
.option .fit{font-size:clamp(50px,6.4vw,92px)}
@media(max-width:600px){.question{padding:.8px .5px}.question .fit,.option .fit{font-size:50px}}
@media(max-height:500px){.question .fit,.option .fit{font-size:52px}}

/* ８カテゴリーを１画面に配置 */
.category-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.category:last-child{grid-column:auto}
.category .label{font-size:clamp(22px,2.6vw,36px);overflow-wrap:anywhere}
@media(max-width:900px){.category-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}.category .label{font-size:clamp(18px,3.8vw,30px)}}

/* 中央の正解表示：従来のフィードバック文字の300% */
#correct-float{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;pointer-events:none}
#correct-float[hidden]{display:none}
.success-card{font-size:clamp(96px,12vw,156px);font-weight:1000;-webkit-text-stroke:1.5px currentColor;line-height:1.45;color:#dc2626;background:transparent;border:0;border-radius:0;padding:0;box-shadow:none;text-shadow:none;text-align:center;white-space:nowrap;max-width:96vw}
.category-score{font-size:clamp(15px,1.7vw,23px);line-height:1.6;background:#ffffffed;color:#0f172a;border-radius:8px;padding:2px 8px;max-width:100%}
.score-help{font-size:clamp(11px,1.15vw,15px);line-height:1.4;color:white}
@media(max-width:900px){.category{gap:2px}.category .label{font-size:clamp(16px,3.5vw,28px)}.category-score{font-size:clamp(13px,2.6vw,19px);padding:1px 5px}.score-help{font-size:11px}}

/* 正解表示は画面最前面へ。上寄せした選択肢は句読点の禁則を保つ。 */
#correct-float::backdrop{background:transparent;pointer-events:none}
#correct-float .success-card{display:block!important;visibility:visible!important;opacity:.8!important}
.option{align-items:flex-start;justify-content:center}
.option .fit{text-align:start;align-self:flex-start;word-break:normal;overflow-wrap:normal;line-break:strict}
.options.three{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
</style>
</head>

<div id="correct-float" popover="manual" hidden role="status" aria-live="assertive" aria-atomic="true"><div class="success-card">〇 せいかい！</div></div>
<script>
const CURRICULUM_DATA = {"bun":{"title":"文の 組み立て","titleRuby":"<ruby>文<rt>ぶん</rt></ruby>の <ruby>組み立て<rt>くみたて</rt></ruby>","colorClass":"rose","steps":[{"name":"【2年】主語・述語・修飾語","nameRuby":"【<ruby>２年<rt>にねん</rt></ruby>】<ruby>主語<rt>しゅご</rt></ruby>・<ruby>述語<rt>じゅつご</rt></ruby>・<ruby>修飾語<rt>しゅうしょくご</rt></ruby>","questions":[{"qRuby":"「（　）が <ruby>走<rt>はし</rt></ruby>る。」に あてはまるのは？","options":[{"r":"<ruby>犬<rt>いぬ</rt></ruby>","correct":true},{"r":"<ruby>空<rt>そら</rt></ruby>","correct":false}],"hint":"はしることが できる いきものを えらぼう。","level":"basic"},{"qRuby":"「<ruby>風<rt>かぜ</rt></ruby>が （　）。」に あてはまるのは？","options":[{"r":"ふく","correct":true},{"r":"<ruby>食<rt>た</rt></ruby>べる","correct":false}],"hint":"かぜが そよそよと うごくことだよ。","level":"basic"},{"qRuby":"「（　）が <ruby>光<rt>ひか</rt></ruby>る。」に あてはまるのは？","options":[{"r":"<ruby>星<rt>ほし</rt></ruby>","correct":true},{"r":"<ruby>本<rt>ほん</rt></ruby>","correct":false}],"hint":"よるの そらで ぴかぴかするよ。","level":"basic"},{"qRuby":"「<ruby>魚<rt>さかな</rt></ruby>が （　）。」に あてはまるのは？","options":[{"r":"<ruby>泳<rt>およ</rt></ruby>ぐ","correct":true},{"r":"<ruby>咲<rt>さ</rt></ruby>く","correct":false}],"hint":"みずの なかを すすむことだよ。","level":"basic"},{"qRuby":"「（　）が <ruby>咲<rt>さ</rt></ruby>く。」に あてはまるのは？","options":[{"r":"<ruby>花<rt>はな</rt></ruby>","correct":true},{"r":"<ruby>石<rt>いし</rt></ruby>","correct":false}],"hint":"きれいな はなびらが ひらくよ。","level":"basic"},{"qRuby":"「だれが・<ruby>何<rt>なに</rt></ruby>が」に あたる ことばは？","options":[{"r":"<ruby>主語<rt>しゅご</rt></ruby>","correct":true},{"r":"<ruby>述語<rt>じゅつご</rt></ruby>","correct":false}],"hint":"ぶんの なかで、だれの ことかを あらわすよ。","level":"basic"},{"qRuby":"「<ruby>鳥<rt>とり</rt></ruby>が なく。」の <ruby>主語<rt>しゅご</rt></ruby>は？","options":[{"r":"<ruby>鳥<rt>とり</rt></ruby>が","correct":true},{"r":"なく","correct":false}],"hint":"ないているのは だれかな。","level":"basic"},{"qRuby":"「<ruby>雨<rt>あめ</rt></ruby>が ふる。」の <ruby>述語<rt>じゅつご</rt></ruby>は？","options":[{"r":"ふる","correct":true},{"r":"<ruby>雨<rt>あめ</rt></ruby>が","correct":false}],"hint":"あめが どうするのかを あらわすよ。","level":"basic"},{"qRuby":" ,{"r":"<ruby>火<rt>ひ</rt></ruby>","correct":false},{"r":"<ruby>糸<rt>いと</rt></ruby>","correct":false},{"r":"<ruby>金属<rt>きんぞく</rt></ruby>","correct":false}],"hint":"さんずいの かんじの いみを かんがえよう。","level":"advanced"},{"qRuby":"「<ruby>絵<rt>え</rt></ruby>」と <ruby>同<rt>おな</rt></ruby>じ「いとへん」の <ruby>漢字<rt>かんじ</rt></ruby>は？","options":[{"r":"<ruby>紙<rt>かみ</rt></ruby>","correct":true},{"r":"<ruby>校<rt>こう</rt></ruby>","correct":false},{"r":"<ruby>池<rt>いけ</rt></ruby>","correct":false},{"r":"<ruby>話<rt>はなし</rt></ruby>","correct":false}],"hint":"ひだりに「糸」が あるものを さがそう。","level":"advanced"},{"qRuby":"「<ruby>草<rt>くさ</rt></ruby>」と <ruby>同<rt>おな</rt></ruby>じ「くさかんむり」の <ruby>漢字<rt>かんじ</rt></ruby>は？","options":[{"r":"<ruby>花<rt>はな</rt></ruby>","correct":true},{"r":"<ruby>雪<rt>ゆき</rt></ruby>","correct":false},{"r":"<ruby>家<rt>いえ</rt></ruby>","correct":false},{"r":"<ruby>笛<rt>ふえ</rt></ruby>","correct":false}],"hint":"うえに「艹」が あるものを さがそう。","level":"advanced"},{"qRuby":"「<ruby>雪<rt>ゆき</rt></ruby>」と <ruby>同<rt>おな</rt></ruby>じ「あめかんむり」の <ruby>漢字<rt>かんじ</rt></ruby>は？","options":[{"r":"<ruby>雲<rt>くも</rt></ruby>","correct":true},{"r":"<ruby>草<rt>くさ</rt></ruby>","correct":false},{"r":"<ruby>空<rt>そら</rt></ruby>","correct":false},{"r":"<ruby>竹<rt>たけ</rt></ruby>","correct":false}],"hint":"うえに「雨」の かたちが あるものを さがそう。","level":"advanced"},{"qRuby":"「<ruby>持<rt>じ</rt></ruby>・<ruby>拾<rt>しゅう</rt></ruby>・<ruby>待<rt>たい</rt></ruby>・<ruby>投<rt>とう</rt></ruby>」で <ruby>部首<rt>ぶしゅ</rt></ruby>が <ruby>違<rt>ちが</rt></ruby>うのは？","options":[{"r":"<ruby>待<rt>たい</rt></ruby>","correct":true},{"r":"<ruby>持<rt>じ</rt></ruby>","correct":false},{"r":"<ruby>拾<rt>しゅう</rt></ruby>","correct":false},{"r":"<ruby>投<rt>とう</rt></ruby>","correct":false}],"hint":"ほかの みっつには てへんが あるよ。","level":"advanced","challenge":true},{"qRuby":"「<ruby>海<rt>かい</rt></ruby>・<ruby>池<rt>ち</rt></ruby>・<ruby>泳<rt>えい</rt></ruby>・<ruby>話<rt>わ</rt></ruby>」で <ruby>部首<rt>ぶしゅ</rt></ruby>が <ruby>違<rt>ちが</rt></ruby>うのは？","options":[{"r":"<ruby>話<rt>わ</rt></ruby>","correct":true},{"r":"<ruby>海<rt>かい</rt></ruby>","correct":false},{"r":"<ruby>池<rt>ち</rt></ruby>","correct":false},{"r":"<ruby>泳<rt>えい</rt></ruby>","correct":false}],"hint":"ほかの みっつには さんずいが あるよ。","level":"advanced","challenge":true},{"qRuby":"「<ruby>言葉<rt>ことば</rt></ruby>」や「<ruby>話<rt>はな</rt></ruby>すこと」に <ruby>関係<rt>かんけい</rt></ruby>する <ruby>部首<rt>ぶしゅ</rt></ruby>の <ruby>組<rt>く</rt></ruby>みは？","options":[{"r":"<ruby>語<rt>ご</rt></ruby>・<ruby>読<rt>どく</rt></ruby>・<ruby>話<rt>わ</rt></ruby>","correct":true},{"r":"<ruby>海<rt>かい</rt></ruby>・<ruby>池<rt>ち</rt></ruby>・<ruby>泳<rt>えい</rt></ruby>","correct":false},{"r":"<ruby>持<rt>じ</rt></ruby>・<ruby>拾<rt>しゅう</rt></ruby>・<ruby>投<rt>とう</rt></ruby>","correct":false},{"r":"<ruby>村<rt>そん</rt></ruby>・<ruby>校<rt>こう</rt></ruby>・<ruby>材<rt>ざい</rt></ruby>","correct":false}],"hint":"「言」の ある なかまを さがそう。","level":"advanced","challenge":true},{"qRuby":"<ruby>同<rt>おな</rt></ruby>じ <ruby>部首<rt>ぶしゅ</rt></ruby>だけの <ruby>組<rt>く</rt></ruby>みは？","options":[{"r":"<ruby>花<rt>か</rt></ruby>・<ruby>草<rt>そう</rt></ruby>・<ruby>茶<rt>ちゃ</rt></ruby>","correct":true},{"r":"<ruby>休<rt>きゅう</rt></ruby>・<ruby>村<rt>そん</rt></ruby>・<ruby>校<rt>こう</rt></ruby>","correct":false},{"r":"<ruby>海<rt>かい</rt></ruby>・<ruby>話<rt>わ</rt></ruby>・<ruby>池<rt>ち</rt></ruby>","correct":false},{"r":"<ruby>持<rt>じ</rt></ruby>・<ruby>待<rt>たい</rt></ruby>・<ruby>拾<rt>しゅう</rt></ruby>","correct":false}],"hint":"うえに くさかんむりが ある なかまだよ。","level":"advanced","challenge":true}]}]}};
const COLORS={bun:'#e11d48',kanji:'#059669',jukugo:'#b45309',nakama:'#4f46e5',tsukai:'#0891b2',kotowaza:'#a21caf',tsunagi:'#0f766e',bushu:'#1d4ed8'};
const R={question:'<ruby>問題<rt>もんだい</rt></ruby>',review:'<ruby>復習<rt>ふくしゅう</rt></ruby>',record:'<ruby>記録<rt>きろく</rt></ruby>'};
class AppController{
 constructor(){this.currentCategory=null;this.currentStepIndex=0;this.activeQuestionList=[];this.mistakenList=[];this.currentQIndex=0;this.isReviewMode=false;this.timer=null;this.runId=0;this.locked=false;this.records={};this.storageOK=true;this.storageKey='kotoba-hiroba-progress-v2';try{const v=JSON.parse(localStorage.getItem(this.storageKey)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))this.records=v;}catch(e){this.storageOK=false;}document.getElementById('home').onclick=()=>this.showTopScreen();document.getElementById('steps-back').onclick=()=>this.selectCategory(this.currentCategory);window.addEventListener('resize',()=>this.fitAll());this.showTopScreen();}
 cancelPending(){this.hideCorrectFeedback();clearTimeout(this.timer);this.timer=null;this.runId++;this.locked=false;}
 screen(view,title,html){this.hideCorrectFeedback();this.currentView=view;document.getElementById('title').innerHTML=title;document.getElementById('home').style.visibility=view==='top'?'hidden':'visible';document.getElementById('steps-back').style.visibility=['quiz','level-intro','review-intro','result'].includes(view)?'visible':'hidden';document.getElementById('main').innerHTML=html;requestAnimationFrame(()=>this.fitAll());}
 fitAll(){document.querySelectorAll('.fit,header h1,.step .label,.category .label').forEach(el=>{el.style.fontSize='';const isFit=el.classList.contains('fit'),box=isFit?el.parentElement:el;const style=getComputedStyle(box);const horizontalPadding=parseFloat(style.paddingLeft||0)+parseFloat(style.paddingRight||0),verticalPadding=parseFloat(style.paddingTop||0)+parseFloat(style.paddingBottom||0);let size=parseFloat(getComputedStyle(el).fontSize);const maxWidth=isFit?box.clientWidth-horizontalPadding:el.clientWidth;const maxHeight=isFit?box.clientHeight-verticalPadding:box.parentElement.clientHeight-12;while(size>14&&(el.scrollWidth>maxWidth+1||el.scrollHeight>maxHeight+1)){size--;el.style.fontSize=size+'px';}});}

 showTopScreen(){this.cancelPending();this.screen('top','ことばの<ruby>広場<rt>ひろば</rt></ruby>',`<h2 class="screen-title">まなびたい ところを えらんでね！</h2><div class="category-grid">${Object.entries(CURRICULUM_DATA).map(([k,c],i)=>`<button type="button" class="category" data-category="${k}" style="--color:${COLORS[k]}"><span class="label">${c.titleRuby}</span><small>${c.steps.length}ステップ</small><span class="category-score">${this.categoryScore(k).total}もんちゅう ${this.categoryScore(k).correct}もん せいかい</span><span class="score-help">さいしんの ちょうせん・１かいめの こたえ</span></button>`).join('')}</div>`);document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>this.selectCategory(b.dataset.category));}
 selectCategory(key){if(!CURRICULUM_DATA[key])return this.showTopScreen();this.cancelPending();this.currentCategory=key;const c=CURRICULUM_DATA[key];this.screen('steps',c.titleRuby,`<h2 class="screen-title">${key==='bun'?'きほん・２たく → ３・４たく':'きほん・２たく → レベルアップ・４たく'}</h2><div class="steps">${c.steps.map((s,i)=>`<button type="button" class="step" data-step="${i}" style="--color:${COLORS[key]}"><span class="number">${i+1}</span><span class="label">${s.nameRuby}</span><span class="badge">${(this.records[key+':'+i]?.cleared&&this.records[key+':'+i]?.total===s.questions.length)?'💮 クリア':'▶'}</span></button>`).join('')}</div><p class="note">${this.storageOK?'クリアの '+R.record+'は、このブラウザに のこるよ。':'このブラウザでは '+R.record+'を のこせません。'}</p>`);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>this.startStep(Number(b.dataset.step)));}
 categoryScore(key){const steps=CURRICULUM_DATA[key].steps;return {total:steps.reduce((n,s)=>n+s.questions.length,0),correct:steps.reduce((n,s,i)=>{const record=this.records[key+':'+i];const value=Number(record?.initialCorrect);return n+(Number.isFinite(value)?Math.max(0,Math.min(s.questions.length,Math.floor(value))):0);},0)};}
 saveRecords(){try{localStorage.setItem(this.storageKey,JSON.stringify(this.records));this.storageOK=true;}catch(e){this.storageOK=false;}}
 saveAttempt(cleared=false){const total=CURRICULUM_DATA[this.currentCategory].steps[this.currentStepIndex].questions.length;this.records[this.currentCategory+':'+this.currentStepIndex]={cleared,initialCorrect:this.initialCorrect,total,answeredCount:this.firstAnswers.size,hints:this.hintsUsed.size,updatedAt:new Date().toISOString(),...(cleared?{completedAt:new Date().toISOString()}:{})};this.saveRecords();}
 recordFirstAnswer(q,correct){if(this.isReviewMode||this.firstAnswers.has(q))return;this.firstAnswers.add(q);if(correct)this.initialCorrect++;this.saveAttempt();}
 showCorrectFeedback(){const feedback=document.getElementById('feedback');if(feedback)feedback.innerHTML='';let el=document.getElementById('correct-float');if(!el){el=document.createElement('div');el.id='correct-float';el.setAttribute('popover','manual');el.setAttribute('role','status');el.setAttribute('aria-live','assertive');document.body.appendChild(el);}el.innerHTML='<div class="success-card">〇 せいかい！</div>';el.hidden=false;el.removeAttribute('hidden');el.style.cssText='position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;margin:0!important;padding:0!important;border:0!important;max-width:none!important;max-height:none!important;background:transparent!important;display:grid!important;place-items:center!important;z-index:2147483647!important;pointer-events:none!important;visibility:visible!important;opacity:1!important;';try{if(typeof el.showPopover==='function'&&!el.matches(':popover-open'))el.showPopover();}catch(e){el.removeAttribute('popover');}}
 hideCorrectFeedback(){const el=document.getElementById('correct-float');if(!el)return;try{if(typeof el.hidePopover==='function'&&el.matches(':popover-open'))el.hidePopover();}catch(e){}el.hidden=true;el.style.setProperty('display','none','important');}

 shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
 startStep(index){const s=CURRICULUM_DATA[this.currentCategory]?.steps[index];if(!s)return;this.cancelPending();this.currentStepIndex=index;this.activeQuestionList=[...s.questions];this.currentQIndex=0;this.mistakenList=[];this.isReviewMode=false;this.initialCorrect=0;this.firstAnswers=new Set();this.firstMistakes=new Set();this.hintsUsed=new Set();this.saveAttempt();this.renderQuestion();}
 renderQuestion(){this.locked=false;const q=this.activeQuestionList[this.currentQIndex];if(!q)return;this.displayOptions=this.shuffle(q.options);const n=q.options.length;const phaseItems=this.activeQuestionList.filter(item=>item.level===q.level&&Boolean(item.challenge)===Boolean(q.challenge));const phaseIndex=this.activeQuestionList.slice(0,this.currentQIndex+1).filter(item=>item.level===q.level&&Boolean(item.challenge)===Boolean(q.challenge)).length;const progress=this.isReviewMode?`おさらい ${this.currentQIndex+1} / ${this.activeQuestionList.length}`:`${(q.challenge?'おうよう':q.level==='basic'?'きほん':'レベルアップ')+'・'+n+'たく'} ${phaseIndex} / ${phaseItems.length}`;this.screen('quiz',CURRICULUM_DATA[this.currentCategory].titleRuby,`<section class="quiz"><div class="toolbar"><span class="level-label">${progress}</span><button type="button" class="hint-btn" id="hint">💡 ヒント</button></div><div class="feedback" id="feedback" role="status" aria-live="polite"><span class="fit">こたえを えらぼう！</span></div><div class="quiz-body"><div class="question"><div class="fit" lang="ja">${q.qRuby}</div></div><div class="options ${n===3?'three':n===4?'four':''}">${this.displayOptions.map((o,i)=>`<button type="button" class="option" data-option="${i}"><span class="fit" lang="ja">${o.r}</span></button>`).join('')}</div></div></section>`);document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>this.checkAnswer(this.displayOptions[Number(b.dataset.option)],b,q));document.getElementById('hint').onclick=()=>this.showHint();}
 message(html){document.getElementById('feedback').innerHTML='<span class="fit">'+html+'</span>';this.fitAll();}
 checkAnswer(option,button,q){if(this.locked||this.currentView!=='quiz'||q!==this.activeQuestionList[this.currentQIndex])return;this.recordFirstAnswer(q,option.correct);if(!option.correct){if(!this.mistakenList.includes(q))this.mistakenList.push(q);if(!this.isReviewMode)this.firstMistakes.add(q);button.classList.add('wrong');button.disabled=true;this.message('もういちど えらんでみよう！');return;}this.locked=true;button.classList.add('right');document.querySelectorAll('.option,#hint').forEach(b=>b.disabled=true);this.showCorrectFeedback();const id=this.runId;this.timer=setTimeout(()=>{this.timer=null;if(id!==this.runId||this.currentView!=='quiz')return;if(++this.currentQIndex<this.activeQuestionList.length){const next=this.activeQuestionList[this.currentQIndex];if(!this.isReviewMode&&((q.level==='basic'&&next.level==='advanced')||(!q.challenge&&next.challenge)))this.showLevelUp(Boolean(next.challenge));else this.renderQuestion();}else this.handleRoundCompletion();},1400);}
 showLevelUp(challenge=false){const mixed=this.currentCategory==='bun';const heading=challenge?'さらに チャレンジ！':mixed?'つぎは ３・４たく！':'つぎは ４たく！';const message=challenge?'すこし むずかしい<br>４もんに ちょうせん！':(mixed?'３つ・４つの なかから<br>こたえを えらぼう！':'４つの なかから<br>こたえを えらぼう！');this.screen('level-intro',challenge?'おうように ちょうせん！':'レベルアップ！',`<section class="end level-up"><div class="end-card"><h2>${heading}</h2><p>${message}</p><button type="button" class="primary" id="advanced-start">チャレンジする</button></div></section>`);document.getElementById('advanced-start').onclick=()=>this.startAdvanced();}
 startAdvanced(){if(this.currentView!=='level-intro')return;this.cancelPending();this.renderQuestion();}

 showHint(){if(this.locked||this.currentView!=='quiz')return;const q=this.activeQuestionList[this.currentQIndex];this.hintsUsed.add(q);this.message('💡 '+q.hint);}
 handleRoundCompletion(){if(this.mistakenList.length){this.screen('review-intro','おさらい',`<section class="end review"><div class="end-card"><h2>まちがえた ${R.question}を<br>${R.review}しよう！</h2><p>あと ${this.mistakenList.length}もん あるよ。</p><button type="button" class="primary" id="review-start">おさらい スタート！</button></div></section>`);document.getElementById('review-start').onclick=()=>this.startReviewRound();}else this.showResult();}
 startReviewRound(){if(this.currentView!=='review-intro'||!this.mistakenList.length)return;this.cancelPending();this.activeQuestionList=[...this.mistakenList];this.mistakenList=[];this.currentQIndex=0;this.isReviewMode=true;this.renderQuestion();}
 showResult(){const steps=CURRICULUM_DATA[this.currentCategory].steps;const total=steps[this.currentStepIndex].questions.length;this.saveAttempt(true);const next=this.currentStepIndex+1<steps.length;this.screen('result','ぜんぶ クリア！',`<section class="end"><div class="end-card"><h2>💮 ぜんぶ クリア！</h2><p>さいごまで よく がんばったね！</p><p>はじめのチャレンジ：${total}もんのうち ${this.initialCorrect}もん せいかい<br>ヒントを みた ${R.question}：${this.hintsUsed.size}もん</p><div class="actions">${next?'<button type="button" class="primary" id="next">つぎの ステップへ</button>':''}<button type="button" class="secondary" id="return-steps">ステップを えらぶ</button></div><p class="note">${this.storageOK?R.record+'を のこしたよ。':R.record+'を のこせませんでした。'}</p></div></section>`);if(next)document.getElementById('next').onclick=()=>this.startStep(this.currentStepIndex+1);document.getElementById('return-steps').onclick=()=>this.selectCategory(this.currentCategory);}
}
const app=new AppController();
</script>
